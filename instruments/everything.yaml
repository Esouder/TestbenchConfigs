name: Everything
description: All Instruments

physical_instruments:
  - uid: hp_6030_a_physical
    name: HP 6030A Power Supply
    class: epcomms.equipment.powersupply.HP6030A
    arguments:
      resource_name: "USB0::1003::8293::HEWLETT-PACKARD_6030A_0_sA.00.05pA.01.01::0::INSTR"
  - uid: keysight_edu_36311a_physical
    name: Keysight EDU36311A Power Supply
    class: epcomms.equipment.powersupply.KeysightEDU36311A
    arguments:
      resource_name: "USB0::10893::36609::CN63070208::0::INSTR"
  - uid: alicat_eip_physical
    name: Alicat EIP Mass Flow Controller
    class: epcomms.equipment.flowcontroller.AlicatEIP
    arguments:
      routing_path: "192.168.0.172"
  - uid: fluke45
    name: Fluke 45 Multimeter
    class: epcomms.equipment.multimeter.Fluke45
    arguments:
      device_location: "/dev/ttyUSB2"
  - uid: keysight_dmm
    name: Keysight Multimeter
    class: epcomms.equipment.multimeter.KeysightEDU34450A
    arguments:
      resource_name: "USB0::10893::36353::CN62350039::0::INSTR"
  - uid: tektronix_4050
    name: Tektronix 4050 DMM
    class: epcomms.equipment.multimeter.TektronixDMM4050
    arguments:
      host: "192.168.0.136"
      port: 3490
  # - uid: terranova_962a
  #   name: Terranova 962A Vacuum Controller
  #   class: epcomms.equipment.vacuumcontroller.Terranova962A
  #   arguments:
  #     device_location: "/dev/ttyUSB1"

translators:
  - metadata:
      uid: hp_6030_a_voltage_translator
      name: HP 6030A Voltage Translator
      description: Translator for HP 6030A Power Supply
    class: PollingTranslator
    physical_instrument_uid: hp_6030_a_physical
    getter_function: measure_voltage
    entities:
      - virtual_instrument:
          uid: hp_6030_a_voltage
          name: Output Voltage
          unit: V
          description: Measured output voltage of the HP 6030A Power Supply
  - metadata:
      uid: hp_6030_a_current_translator
      name: HP 6030A Current Translator
      description: Translator for HP 6030A Power Supply
    class: PollingTranslator
    physical_instrument_uid: hp_6030_a_physical
    getter_function: measure_current
    entities:
      - virtual_instrument:
          uid: hp_6030_a_current
          name: Output Current
          unit: A
          description: Measured output current of the HP 6030A Power Supply
  - metadata:
      uid: keysight_edu_36311a_voltage_translator
      name: Keysight EDU36311A Voltage Translator
      description: Translator for Keysight EDU36311A Power Supply
    class: PollingTranslator
    physical_instrument_uid: keysight_edu_36311a_physical
    getter_function: measure_voltage
    getter_arguments:
      channel: [1,2,3]
    entities:
      - virtual_instrument:
          uid: keysight_edu_36311a_voltage
          name: Channel 1Output Voltage
          unit: V
          description: Measured output voltage of the Keysight EDU36311A Power Supply Channel 1
      - virtual_instrument:
          uid: keysight_edu_36311a_voltage_2
          name: Channel 2 Output Voltage
          unit: V
          description: Measured output voltage of the Keysight EDU36311A Power Supply Channel 2
      - virtual_instrument:
          uid: keysight_edu_36311a_voltage_3
          name: Channel 3 Output Voltage
          unit: V
          description: Measured output voltage of the Keysight EDU36311A Power Supply Channel 3
