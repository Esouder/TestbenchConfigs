  - metadata:
      uid: keysight_dmm_voltage_translator
      name: Keysight DMM Voltage Translator
      description: Translator for Keysight Multimeter
    class: PollingTranslator
    physical_instrument_uid: keysight_dmm
    getter_function: measure_voltage_dc
    polling_interval: 2.0
    entities:
      - virtual_instrument:
          uid: keysight_dmm_voltage
          name: Keysight Measured Voltage
          unit: VDC
          description: Measured voltage by the Keysight Multimeter
  - metadata:
      uid: tektronix_4050_voltage_translator
      name: Tektronix 4050 Voltage Translator
      description: Translator for Tektronix 4050 DMM
    class: PollingTranslator
    physical_instrument_uid: tektronix_4050
    getter_function: measure_voltage_dc
    entities:
      - virtual_instrument:
          uid: tektronix_4050_voltage
          name: Measured Voltage  
          unit: VDC
          description: Measured voltage by the Tektronix 4050 DMM
